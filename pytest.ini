; pytest configuration.
;
; Every test in tests/ is a plain unittest.TestCase (IsolatedAsyncioTestCase for
; async code) and must run identically under both runners:
;
;   venv/bin/python -m unittest discover -s tests -t .   # the gate
;   venv/bin/python -m pytest -q
;
; tests/ is a package, so the repo root is on sys.path and `import services...`
; resolves the same way under both.
[pytest]
testpaths = tests
python_files = test_*.py
